on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest 
    
      - name: Build binary
        run: scripts/buildprod.sh

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/167821560965/locations/global/workloadIdentityPools/github/providers/my-repo"
          service_account: "cloud-run-deployer@notely-515515.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: gcloud builds submit --tag europe-west1-docker.pkg.dev/notely-515515/notely-ar-repo/notely:latest .     

      - name: Run database migrations
        run: scripts/migrateup.sh
     
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image europe-west1-docker.pkg.dev/notely-515515/notely-ar-repo/notely:latest --region europe-west1 --allow-unauthenticated --project notely-515515 --max-instances=4
